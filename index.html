<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>BetterPhone | Pure Safety</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap');
      
      :root {
        --espresso: #3E2723;
        --clay: #8D6E63;
        --sand: #D7CCC8;
        --cream: #FDFBFA;
        --gold: #A1887F;
        --phone-bezel: #1C1917;
      }

      body {
        font-family: 'Plus Jakarta Sans', sans-serif;
        background-color: #E7E5E4;
        display: flex;
        align-items: center;
        justify-content: center;
        min-height: 100vh;
        margin: 0;
        overflow: hidden;
        color: var(--espresso);
      }

      /* Premium Phone Device Frame */
      #phone-wrapper {
        position: relative;
        width: 400px;
        height: 860px;
        background: var(--phone-bezel);
        border-radius: 56px;
        box-shadow: 
          0 0 0 4px #292524,
          0 50px 100px -20px rgba(28, 25, 23, 0.4),
          0 30px 60px -30px rgba(0, 0, 0, 0.5);
        padding: 14px;
        box-sizing: border-box;
      }

      #phone-content {
        position: relative;
        width: 100%;
        height: 100%;
        background-color: var(--cream);
        border-radius: 42px;
        overflow: hidden;
        display: flex;
        flex-direction: column;
        border: 1px solid rgba(0,0,0,0.1);
        /* Subtle mesh gradient background */
        background-image: 
          radial-gradient(at 0% 0%, rgba(215, 204, 200, 0.3) 0px, transparent 50%),
          radial-gradient(at 100% 100%, rgba(141, 110, 99, 0.1) 0px, transparent 50%);
      }

      /* Aurora Background Blobs */
      .aurora-blob {
        position: absolute;
        border-radius: 50%;
        filter: blur(60px);
        opacity: 0.4;
        z-index: 0;
        animation: float 20s infinite ease-in-out;
      }

      .blob-1 {
        top: -10%;
        left: -10%;
        width: 300px;
        height: 300px;
        background: var(--sand);
        animation-delay: 0s;
      }

      .blob-2 {
        bottom: 20%;
        right: -20%;
        width: 250px;
        height: 250px;
        background: var(--clay);
        opacity: 0.2;
        animation-delay: -5s;
      }

      .blob-3 {
        top: 40%;
        left: 20%;
        width: 200px;
        height: 200px;
        background: var(--espresso);
        opacity: 0.05;
        animation-delay: -10s;
      }

      @keyframes float {
        0% { transform: translate(0, 0) rotate(0deg); }
        33% { transform: translate(30px, -50px) rotate(10deg); }
        66% { transform: translate(-20px, 20px) rotate(-5deg); }
        100% { transform: translate(0, 0) rotate(0deg); }
      }

      /* Glassmorphism Utilities */
      .glass-panel {
        background: rgba(255, 255, 255, 0.7);
        backdrop-filter: blur(12px);
        -webkit-backdrop-filter: blur(12px);
        border: 1px solid rgba(255, 255, 255, 0.5);
      }

      .glass-nav {
        background: rgba(255, 255, 255, 0.85);
        backdrop-filter: blur(20px);
        -webkit-backdrop-filter: blur(20px);
        border-top: 1px solid rgba(215, 204, 200, 0.3);
      }

      /* Soft Shadows */
      .shadow-soft {
        box-shadow: 
          0 4px 6px -1px rgba(62, 39, 35, 0.05),
          0 2px 4px -1px rgba(62, 39, 35, 0.03);
      }
      
      .shadow-glow {
        box-shadow: 0 20px 40px -12px rgba(62, 39, 35, 0.25);
      }

      /* Noise Texture Overlay */
      #phone-content::before {
        content: "";
        position: absolute;
        inset: 0;
        z-index: 9999;
        opacity: 0.03;
        pointer-events: none;
        background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noiseFilter'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.65' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noiseFilter)'/%3E%3C/svg%3E");
      }

      /* Dynamic Island */
      .dynamic-island {
        position: absolute;
        top: 24px;
        left: 50%;
        transform: translateX(-50%);
        width: 120px;
        height: 35px;
        background: #000;
        border-radius: 20px;
        z-index: 1000;
        pointer-events: none;
      }
      
      /* Home Indicator */
      .home-indicator {
        position: absolute;
        bottom: 8px;
        left: 50%;
        transform: translateX(-50%);
        width: 120px;
        height: 5px;
        background: #3E2723;
        border-radius: 10px;
        opacity: 0.2;
        z-index: 100;
        pointer-events: none;
      }

      .ai-gradient {
        background: linear-gradient(135deg, #3E2723 0%, #8D6E63 100%);
      }

      .ai-text-gradient {
        background: linear-gradient(135deg, #3E2723 0%, #8D6E63 100%);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
      }

      .premium-card {
        background: white;
        border: 1px solid rgba(141, 110, 99, 0.1);
        box-shadow: 0 10px 30px -5px rgba(62, 39, 35, 0.04);
      }

      @keyframes slideIn {
        from { opacity: 0; transform: translateY(20px); }
        to { opacity: 1; transform: translateY(0); }
      }

      @keyframes slideInLeft {
        from { opacity: 0; transform: translateX(-20px); }
        to { opacity: 1; transform: translateX(0); }
      }

      @keyframes slideInRight {
        from { opacity: 0; transform: translateX(20px); }
        to { opacity: 1; transform: translateX(0); }
      }

      @keyframes fadeIn {
        from { opacity: 0; }
        to { opacity: 1; }
      }

      @keyframes scaleIn {
        from { opacity: 0; transform: scale(0.95); }
        to { opacity: 1; transform: scale(1); }
      }

      @keyframes scannerLine {
        0% { top: 0%; }
        50% { top: 100%; }
        100% { top: 0%; }
      }

      .animate-scanner-line {
        animation: scannerLine 3s ease-in-out infinite;
      }

      .animate-fadeIn {
        animation: fadeIn 0.4s ease-out forwards;
      }

      .animate-scaleIn {
        animation: scaleIn 0.3s ease-out forwards;
      }

      .animate-spin-slow {
        animation: spin 3s linear infinite;
      }

      @keyframes spin {
        from { transform: rotate(0deg); }
        to { transform: rotate(360deg); }
      }

      .step-enter {
        animation: slideIn 0.4s cubic-bezier(0.2, 0.8, 0.2, 1) forwards;
      }

      .step-enter-left {
        animation: slideInLeft 0.4s cubic-bezier(0.2, 0.8, 0.2, 1) forwards;
      }

      .step-enter-right {
        animation: slideInRight 0.4s cubic-bezier(0.2, 0.8, 0.2, 1) forwards;
      }

      /* Focus visible styles for accessibility */
      button:focus-visible,
      input:focus-visible,
      a:focus-visible {
        outline: 2px solid var(--espresso);
        outline-offset: 2px;
      }

      /* Screen reader only class */
      .sr-only {
        position: absolute;
        width: 1px;
        height: 1px;
        padding: 0;
        margin: -1px;
        overflow: hidden;
        clip: rect(0, 0, 0, 0);
        white-space: nowrap;
        border: 0;
      }

      /* Hide scrollbars but keep functionality */
      .no-scrollbar::-webkit-scrollbar { display: none; }
      .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }

      @keyframes fillBar {
        from { width: 0%; }
        to { width: 100%; }
      }

      .animate-fillBar {
        animation: fillBar linear forwards;
      }

      @media (max-width: 500px) {
        #phone-wrapper {
          width: 100vw;
          height: 100vh;
          border-radius: 0;
          padding: 0;
          box-shadow: none;
        }
        #phone-content { border-radius: 0; }
        .dynamic-island { display: none; }
      }
    </style>
    <script type="importmap">
    {
      "imports": {
        "react": "https://esm.sh/react@^19.2.3",
        "react-dom/": "https://esm.sh/react-dom@^19.2.3/",
        "react/": "https://esm.sh/react@^19.2.3/",
        "@google/genai": "https://esm.sh/@google/genai@^1.38.0"
      }
    }
    </script>
  <link rel="stylesheet" href="/index.css">
</head>
  <body>
    <div id="phone-wrapper">
      <div class="dynamic-island"></div>
      <div id="phone-content">
        <div class="aurora-blob blob-1"></div>
        <div class="aurora-blob blob-2"></div>
        <div class="aurora-blob blob-3"></div>
        <div id="root" style="height: 100%;"></div>
        <div class="home-indicator"></div>
      </div>
    </div>
  <script type="module" src="/index.tsx"></script>
</body>
</html>
